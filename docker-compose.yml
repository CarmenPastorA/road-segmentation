version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    networks:
      - app-network

  ui:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000/predict-image
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
